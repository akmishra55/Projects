{% extends "base.html" %}

{% block title %}Verify OTP{% endblock %}

{% block content %}
<h2>Two-Factor Authentication</h2>
<form method="POST">
    <label>Enter 6-digit OTP:</label>
    <input type="text" name="otp" required>

    <button type="submit">Verify OTP</button>
</form>
{% endblock %}
