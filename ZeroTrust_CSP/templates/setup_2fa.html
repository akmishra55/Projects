{% extends "base.html" %}

{% block title %}Setup 2FA{% endblock %}

{% block content %}
<h2>Set Up Two-Factor Authentication</h2>
<p>Hello {{ username }}, scan this QR code using Google Authenticator or Authy.</p>

<img src="{{ url_for('static', filename=qr_file) }}" alt="QR Code" width="250">

<p>After scanning, go to the login page.</p>

<a href="{{ url_for('login') }}">
    <button>Go to Login</button>
</a>
{% endblock %}
